name: Deploy PR to Render

# main과 develop 브랜치를 향해 PR이 생성/수정될 때 실행
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

jobs:
  deploy-pr:
    name: Trigger Render Deployment on PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 배포 전 프로젝트 빌드 검증 (에러가 있으면 배포하지 않음)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Check
        run: npm run build

      # 2. Render Deploy Hook 호출 (Render에 배포 요청)
      - name: Trigger Render Deploy Hook
        if: success()
        run: |
          echo "Render 배포를 요청합니다..."
          response=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          http_code=$(echo "$response" | tail -n 1)
          
          if [ "$http_code" -eq 200 ] || [ "$http_code" -eq 201 ]; then
            echo "Render 배포 요청 성공!"
          else
            echo "Render 배포 요청 실패 (HTTP Status: $http_code)"
            exit 1
          fi

      # 3. PR에 배포 완료 안내 댓글 작성
      - name: 배포 완료 안내
        uses: actions/github-script@v7
        if: success()
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '**[알림]** Render에 배포 요청이 성공적으로 전송되었습니다!'
            })